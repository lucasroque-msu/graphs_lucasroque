[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphs_lucasroque"
version = "0.0.1"
authors = [
  { name="Lucas Roque", email="lroque@msudenver.edu" },
]
description = "A small example package for homework 5"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/lucasroque-msu/graphs_lucasroque"
"Bug Tracker" = "https://github.com/lucasroque-msu/graphs_lucasroque/issues"